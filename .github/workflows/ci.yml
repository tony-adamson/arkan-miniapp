name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arkan
          POSTGRES_PASSWORD: arkan
          POSTGRES_DB: arkan
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U arkan -d arkan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 56333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: lint
        run: |
          uv run --project backend ruff check backend
          uv run --project backend ruff format --check backend
      - name: typecheck
        run: uv run --project backend mypy --config-file backend/pyproject.toml backend/app
      - name: pytest
        run: uv run --project backend --env-file infra/env.test pytest backend/tests
