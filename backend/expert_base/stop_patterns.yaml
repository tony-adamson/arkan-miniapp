# Стоп-паттерны (D7, D13).
#
# `crisis` — сигнал для промпта проверки свободного текста (вопрос, ответ между
# картами, вечерняя сверка). Паттерн сам по себе вердикт не выставляет: решение
# принимает модель, а при недоступной LLM кризис подтверждается только по
# совпадению паттерна (фаза 7).
#
# `predictions` — слова из `docs/expert-brief.md` §5. Совпадение — сигнал судье
# перечитать текст, а не автоматический отказ.
crisis:
  - не хочу жить
  - не вижу смысла жить
  - нет смысла жить
  - хочу умереть
  - лучше бы меня не было
  - покончить с собой
  - покончу с собой
  - убить себя
  - суицид
  - самоубийство
  - себе навредить
  - причинить себе вред
  - резать себя
  - исчезнуть навсегда
  - умираю
  - не хочу больше существовать

predictions:
  - будет
  - будут
  - случится
  - случиться
  - ждёт
  - ждет
  - неизбежно
