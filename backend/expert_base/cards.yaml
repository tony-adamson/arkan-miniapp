  - тишина
  meaning_general: Жрица говорит о знании, которое у вас уже есть, но которое вы себе не разрешаете назвать вслух. Она не советует действовать и не торопит с решением.
  meaning_relationships: В отношениях Жрица указывает на то, что вы замечаете, но не произносите. Она оставляет вопрос о том, что вы уже знаете об этой связи.
  meaning_work: В деле Жрица описывает знание, которое вы держите при себе. Она не подсказывает решение, а показывает, где вы его уже приняли.
  meaning_choice: 'При выборе Жрица говорит про знание, которое вы не разрешаете себе назвать. Она возвращает вопрос: что вам уже известно, хотя вы это не произносите.'
  meaning_daily: День, в котором важно то, что вы знаете, но пока не говорите. Карта спрашивает, что вы держите при себе.
  not_to_say:
  - не советует действовать
  - не утверждает, что решение принято против вашей воли
  - не называет сроков
  reflection_question: Что вы уже знаете об этой ситуации, хотя ещё не сказали этого вслух?
